name: Upload to Google Drive

# Перезаливка УЖЕ ГОТОВОГО выпуска из релиза final-<id> на Google Drive.
# Обычно не нужна: build.yml выкладывает ролик сам сразу после релиза.
# Нужна, когда секреты GDRIVE_* завели позже, чем собрали ролик, или
# выкладка в build.yml сорвалась. Файлы идут с раннера в Drive API
# напрямую (pipeline/drive.py), через чат/MCP — ни байта.
#
# Учти: cleanup.yml через неделю удаляет final.mp4 из релиза. Тогда
# уедут только субтитры, шортсы и обложки — что в релизе осталось.

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Имя выпуска (как в jobs/<имя>.json)'
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet requests
      - name: Берём файлы из релиза
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job }}
        run: |
          set -e
          ID=$(python -c "import json,sys;print(json.load(open('jobs/'+sys.argv[1]+'.json'))['id'])" "$JOB" 2>/dev/null || echo "$JOB")
          echo "ID=$ID" >> "$GITHUB_ENV"
          DIR="work/$ID/out"
          mkdir -p "$DIR/shorts"
          gh release download "final-$JOB" -D "$DIR" --clobber
          mv "$DIR"/short_*.mp4 "$DIR/shorts/" 2>/dev/null || true
          ls -la "$DIR" "$DIR/shorts"
      - name: Выкладываем на Google Drive
        env:
          GDRIVE_CLIENT_ID:     ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_ROOT_NAME:     ${{ vars.GDRIVE_ROOT_NAME }}
        run: python pipeline/drive.py upload "$ID" "work/$ID/out"
