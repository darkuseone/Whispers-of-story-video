name: Build video

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'Имя файла в jobs/ без .json'
        required: true
        default: 'ancient-01'
      stage:
        description: 'smoke / magnific / material / vet / assets / render / auto'
        required: true
        default: 'auto'
  push:
    branches:
      - main
    paths:
      - 'jobs/*.json'

# Ручной запуск — как раньше. Push в main по jobs/*.json срабатывает только
# если в коммите ПОЯВИЛСЯ новый файл (git status A), а не правка готовой
# спецификации. Шаблоны *-example / *-test / *-mini автозапуском не трогаем.

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.find.outputs.jobs }}
      stage: ${{ steps.find.outputs.stage }}
      run_build: ${{ steps.find.outputs.run_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Какие ролики собирать
        id: find
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            JOB="${{ github.event.inputs.job }}"
            STAGE="${{ github.event.inputs.stage }}"
            echo "jobs=[\"$JOB\"]" >> "$GITHUB_OUTPUT"
            echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            echo "Ручной запуск: $JOB, этап $STAGE"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git show --name-status --format= "$AFTER" -- jobs/ || true)
          else
            DIFF=$(git diff --name-status "$BEFORE" "$AFTER" -- jobs/ || true)
          fi

          SKIP_SUFFIX='-(example|test|mini)$'
          JOBS=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            status="${line%%$'\t'*}"
            file="${line#*$'\t'}"
            [ "$status" = "A" ] || continue
            case "$file" in
              jobs/*.json) ;;
              *) continue ;;
            esac
            base="${file#jobs/}"
            base="${base%.json}"
            if [[ "$base" =~ $SKIP_SUFFIX ]]; then
              echo "пропуск шаблона: $base"
              continue
            fi
            JOBS+=("$base")
          done <<< "$DIFF"

          if [ ${#JOBS[@]} -eq 0 ]; then
            echo "Новых спецификаций нет — только правка существующих jobs/*.json"
            echo "jobs=[]" >> "$GITHUB_OUTPUT"
            echo "stage=auto" >> "$GITHUB_OUTPUT"
            echo "run_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JSON=$(printf '%s\n' "${JOBS[@]}" | python3 -c \
            'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "jobs=$JSON" >> "$GITHUB_OUTPUT"
          echo "stage=auto" >> "$GITHUB_OUTPUT"
          echo "run_build=true" >> "$GITHUB_OUTPUT"
          echo "Автозапуск: $JSON (этап auto)"

  build:
    needs: detect
    if: needs.detect.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330      # лимит GitHub 360, оставляем запас на выкладку
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.detect.outputs.jobs) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ставим FFmpeg и библиотеки
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip --quiet
          python -m pip install --quiet -r requirements.txt
          fc-list | grep -qi dejavu || sudo apt-get install -y -qq fonts-dejavu
          echo "ffmpeg: $(ffmpeg -version | head -1)"

      - name: Какой ролик собираем
        id: pick
        run: |
          set -e
          JOB="${{ matrix.job }}"
          STAGE="${{ needs.detect.outputs.stage }}"
          test -f "jobs/$JOB.json" || { echo "Нет файла jobs/$JOB.json"; exit 1; }
          # Папка работ называется по полю id ВНУТРИ спецификации, а не по
          # имени файла: они могут не совпадать, и тогда кэш и выкладка
          # смотрят в несуществующую папку.
          ID=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['id'])" "jobs/$JOB.json")
          # ДИАГНОСТИЧЕСКИЙ этап — тот, который ничего не собирает и ничем
          # не рискует: отработал свою проверку и на этом всё. Флаг заведён
          # одной строкой ровно потому, что раньше каждый шаг конвейера
          # перечислял исключения сам («не render и не material и не vet и
          # не smoke»), и добавленный этап проваливался мимо всех этих
          # перечислений прямиком в сборку — на этом уже сгорел один
          # запуск. Новый диагностический этап дописывается СЮДА, и ниже
          # менять нечего.
          case "$STAGE" in
            smoke|magnific) DIAG=true ;;
            *)              DIAG=false ;;
          esac
          echo "job=$JOB"     >> $GITHUB_OUTPUT
          echo "stage=$STAGE" >> $GITHUB_OUTPUT
          echo "diag=$DIAG"   >> $GITHUB_OUTPUT
          echo "id=$ID"       >> $GITHUB_OUTPUT
          echo "Собираю: $JOB (папка work/$ID), этап: $STAGE"

      - name: Проверка секретов
        env:
          XAI_API_KEY:        ${{ secrets.XAI_API_KEY }}
          MAGNIFIC_API_KEY:   ${{ secrets.MAGNIFIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:    ${{ secrets.PIXABAY_API_KEY }}
          # Только факт наличия, не значения: Variables в логах НЕ маскируются.
          SAME_NAMES_IN_VARS: ${{ vars.XAI_API_KEY != '' || vars.MAGNIFIC_API_KEY != '' || vars.ELEVENLABS_API_KEY != '' || vars.PEXELS_API_KEY != '' || vars.PIXABAY_API_KEY != '' }}
        run: |
          # На material и render генерация и озвучка не запускаются, их ключи
          # там не нужны — иначе бесплатный добор падал бы из-за xAI.
          # material не требует ничего обязательного: шесть источников из
          # восьми открыты и работают без ключей (Wikimedia, Met, Openverse,
          # Art Institute, Cleveland, Library of Congress, archive.org). Без
          # Pexels и Pixabay не будет только стокового видео — этап соберёт
          # архивные фото и листы отбора, а не упадёт. Проверка, которая
          # роняет работающий прогон, хуже отсутствующей.
          #
          # ГЕНЕРАЦИЯ КАРТИНОК ДЕЛИТСЯ 70/30 между Magnific и xAI, и
          # обязателен хотя бы ОДИН из двух ключей: при отсутствующем
          # втором доля целиком уходит уцелевшему (см. assets.build_images).
          # Поэтому оба стоят в want, а не в need, и проверяются отдельной
          # строкой ниже.
          case "${{ steps.pick.outputs.stage }}" in
            smoke)    need="" ; want="" ;;
            magnific) need="MAGNIFIC_API_KEY" ; want="" ;;
            material) need="" ; want="PEXELS_API_KEY PIXABAY_API_KEY MAGNIFIC_API_KEY" ;;
            vet)      need="" ; want="XAI_API_KEY" ;;
            render)   need="" ; want="" ;;
            *)        need="ELEVENLABS_API_KEY PEXELS_API_KEY PIXABAY_API_KEY" ; want="ELEVENLABS_VOICE_ID XAI_API_KEY MAGNIFIC_API_KEY" ;;
          esac
          case "${{ steps.pick.outputs.stage }}" in
            smoke|magnific|material|vet|render) ;;
            *)
              if [ -z "$XAI_API_KEY" ] && [ -z "$MAGNIFIC_API_KEY" ]; then
                echo "ПУСТО: и XAI_API_KEY, и MAGNIFIC_API_KEY — рисовать картинки нечем"
                exit 1
              fi
              ;;
          esac
          for k in $want; do
            eval "v=\$$k"
            if [ -z "$v" ]; then
              echo "нет:   $k — будет взято поле voice_id из спецификации ролика"
            else
              echo "есть:  $k"
            fi
          done
          miss=0
          for k in $need; do
            eval "v=\$$k"
            if [ -z "$v" ]; then echo "ПУСТО: $k"; miss=1; else echo "есть:  $k"; fi
          done
          if [ $miss -ne 0 ]; then
            echo
            echo "Settings -> Secrets and variables -> Actions -> вкладка Secrets"
            echo "(именно Repository secrets, имена посимвольно)"
            if [ "$SAME_NAMES_IN_VARS" = "true" ]; then
              echo "НАЙДЕНО: ключи с этими именами лежат во вкладке Variables."
              echo "Их надо перенести в Secrets: значения Variables видны в логах."
            fi
            exit 1
          fi

      # Ключ уникален на запуск, восстановление по префиксу берёт самую
      # свежую запись. С постоянным ключом cache не сохраняет ничего.
      - name: Достаём материалы из кэша
        uses: actions/cache/restore@v4
        with:
          path: work/${{ steps.pick.outputs.id }}/assets
          key: assets-${{ steps.pick.outputs.id }}-v1-${{ github.run_id }}
          restore-keys: |
            assets-${{ steps.pick.outputs.id }}-v1-

      # Суточный расход библиотеки Magnific. Лимит общий на все ролики и
      # все пересборки, поэтому счётчик обязан пережить раннер, а раннер
      # эфемерный. Ключ по ДАТЕ: назавтра кэша с этим ключом нет, и счёт
      # начинается с нуля сам собой, без единой строчки кода.
      - name: Достаём суточный счётчик Magnific
        id: ledger
        run: echo "day=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        with:
          path: channel/magnific_usage.json
          key: magnific-${{ steps.ledger.outputs.day }}-${{ github.run_id }}
          restore-keys: |
            magnific-${{ steps.ledger.outputs.day }}-

      # Прогон монтажа на синтетическом материале: ни одного ключа, ни
      # одного запроса наружу, минуты вместо получаса. Ловит ровно то, что
      # ловится дёшево, — рассинхрон таймлайна, доли материала, статику на
      # долгих кадрах, длину блоков сценария.
      - name: Смоук-прогон без ключей и без денег
        if: steps.pick.outputs.stage == 'smoke'
        run: |
          set -e
          python pipeline/mock.py  jobs/${{ steps.pick.outputs.job }}.json
          python pipeline/smoke.py jobs/${{ steps.pick.outputs.job }}.json

      # Диагностика Magnific без сборки ролика: принят ли ключ, отвечает ли
      # библиотека и СУЩЕСТВУЮТ ЛИ пути всех восьми моделей. Ничего не
      # генерирует и не списывает суточный лимит — POST уходит с пустым
      # телом, и сервис отвечает «нет prompt» задолго до генерации.
      # Нужен потому, что slug модели подобран по образцу соседних (своя
      # документация отдаёт боту 403), а неверный slug виден иначе только
      # как молчаливый откат на xAI посреди боевого прогона.
      - name: Проверка путей и ключа Magnific
        if: steps.pick.outputs.stage == 'magnific'
        env:
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
        run: python pipeline/magnific.py selftest

      - name: Только отбраковка — без скачивания
        if: steps.pick.outputs.stage == 'vet'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -e
          python pipeline/assets.py jobs/${{ steps.pick.outputs.job }}.json vet
          python pipeline/preview.py jobs/${{ steps.pick.outputs.job }}.json

      - name: Этап 0 — добор материала и листы отбора
        if: steps.pick.outputs.stage == 'material'
        env:
          PEXELS_API_KEY:  ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # Отбраковка на этом этапе тоже смотрит зрением, ключ ей нужен.
          XAI_API_KEY:     ${{ secrets.XAI_API_KEY }}
          # Библиотека Magnific — последняя очередь, только по запросам,
          # где открытые архивы не дали ничего. Суточный лимит внутри.
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
        run: |
          set -e
          python pipeline/assets.py jobs/${{ steps.pick.outputs.job }}.json material
          python pipeline/preview.py jobs/${{ steps.pick.outputs.job }}.json

      - name: Выдаём листы отбора
        if: steps.pick.outputs.stage == 'material' || steps.pick.outputs.stage == 'vet'
        uses: actions/upload-artifact@v4
        with:
          name: select-${{ steps.pick.outputs.job }}
          path: work/${{ steps.pick.outputs.id }}/out/select_*.jpg
          if-no-files-found: error
          retention-days: 30

      # Те же листы ещё и релизом. Артефакт лежит на хранилище Azure, и
      # ссылка на него временная и подписанная: её нельзя просто открыть,
      # переслать или забрать скриптом. Релиз отдаётся с github.com прямой
      # ссылкой, которая не протухает — а шаг отбора это ровно тот шаг,
      # где листы надо открыть, посмотреть и обсудить.
      - name: Листы отбора отдельной ссылкой
        if: steps.pick.outputs.stage == 'material' || steps.pick.outputs.stage == 'vet'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: select-${{ steps.pick.outputs.job }}
          name: Отбор материала — ${{ steps.pick.outputs.job }}
          body: |
            Контактные листы: крупный номер в углу — номер файла.
            Негодное вписать в `reject` в спецификации ролика:

                "reject": { "clip": [номера], "arch": [номера] }

            Жёлтой рамкой обведены кадры на белом фоне: на холодном
            тёмном цветокоре канала они становятся дырой в кадре.
            Это пометка, а не приговор — решать человеку.

            Файлы при отказе не удаляются: отказ отменяется удалением
            номера, без повторного скачивания.
          files: work/${{ steps.pick.outputs.id }}/out/select_*.jpg
          fail_on_unmatched_files: true

      - name: Этап 1 — озвучка, изображения, материал
        if: steps.pick.outputs.diag != 'true' && steps.pick.outputs.stage != 'render' && steps.pick.outputs.stage != 'material' && steps.pick.outputs.stage != 'vet'
        env:
          XAI_API_KEY:        ${{ secrets.XAI_API_KEY }}
          # 70% картинок, редкие вставки видео и библиотека графики.
          MAGNIFIC_API_KEY:   ${{ secrets.MAGNIFIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Голос канала. Без этой строки секрет есть в репозитории, но до
          # процесса не доходит, и озвучка падает на «не задан голос».
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:    ${{ secrets.PIXABAY_API_KEY }}
        run: python pipeline/assets.py jobs/${{ steps.pick.outputs.job }}.json

      # Счётчик Magnific уезжает обратно тем же ключом с датой. Если
      # сегодня к библиотеке не обращались, файла нет и шаг тихо ничего не
      # сохраняет — это нормально.
      - name: Кладём суточный счётчик Magnific обратно
        if: steps.pick.outputs.diag != 'true' && hashFiles('channel/magnific_usage.json') != ''
        uses: actions/cache/save@v4
        with:
          path: channel/magnific_usage.json
          key: magnific-${{ steps.ledger.outputs.day }}-${{ github.run_id }}

      # Только если что-то качали. На чистом перерендере папка не менялась.
      - name: Кладём материалы в кэш
        if: steps.pick.outputs.diag != 'true' && steps.pick.outputs.stage != 'render'
        uses: actions/cache/save@v4
        with:
          path: work/${{ steps.pick.outputs.id }}/assets
          key: assets-${{ steps.pick.outputs.id }}-v1-${{ github.run_id }}

      - name: Этап 2 — монтаж
        if: steps.pick.outputs.diag != 'true' && steps.pick.outputs.stage != 'assets' && steps.pick.outputs.stage != 'material' && steps.pick.outputs.stage != 'vet'
        run: python pipeline/build.py jobs/${{ steps.pick.outputs.job }}.json

      # Описание, главы, две обложки через xAI (крупный жёлтый текст на
      # картинке). Без ключа covers.py уйдёт в запасной PIL-кадр из ролика.
      - name: Этап 3 — комплект для YouTube
        if: steps.pick.outputs.diag != 'true' && steps.pick.outputs.stage != 'assets' && steps.pick.outputs.stage != 'material' && steps.pick.outputs.stage != 'vet'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python pipeline/youtube.py jobs/${{ steps.pick.outputs.job }}.json

      # Два вертикальных шортса: хук и развязка. Вопрос сверху на всю
      # длину, белые пословные капшены сверху. Ключей не тратит — режет
      # исходники кадров и звук из final.mp4 локальным ffmpeg.
      - name: Этап 4 — шортсы
        if: steps.pick.outputs.diag != 'true' && steps.pick.outputs.stage != 'assets' && steps.pick.outputs.stage != 'material' && steps.pick.outputs.stage != 'vet'
        run: python pipeline/shorts.py jobs/${{ steps.pick.outputs.job }}.json

      - name: Находим готовое
        id: out
        if: steps.pick.outputs.diag != 'true' && steps.pick.outputs.stage != 'assets' && steps.pick.outputs.stage != 'material' && steps.pick.outputs.stage != 'vet'
        run: |
          set -e
          DIR=work/${{ steps.pick.outputs.id }}/out
          test -f "$DIR/final.mp4" || { echo "final.mp4 не найден"; find work -type f | head -40; exit 1; }
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          ls -la "$DIR"

      - name: Выдаём ролик
        if: steps.pick.outputs.diag != 'true' && steps.pick.outputs.stage != 'assets' && steps.pick.outputs.stage != 'material' && steps.pick.outputs.stage != 'vet'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: final-${{ steps.pick.outputs.job }}
          name: Готово — ${{ steps.pick.outputs.job }}
          files: |
            ${{ steps.out.outputs.dir }}/final.mp4
            ${{ steps.out.outputs.dir }}/subs.srt
            ${{ steps.out.outputs.dir }}/shorts/short_1.mp4
            ${{ steps.out.outputs.dir }}/shorts/short_2.mp4
            ${{ steps.out.outputs.dir }}/cover_1.jpg
            ${{ steps.out.outputs.dir }}/cover_2.jpg
          fail_on_unmatched_files: true

      - name: Комплект для выкладки отдельно
        if: steps.pick.outputs.diag != 'true' && steps.pick.outputs.stage != 'assets' && steps.pick.outputs.stage != 'material' && steps.pick.outputs.stage != 'vet'
        uses: actions/upload-artifact@v4
        with:
          name: youtube-${{ steps.pick.outputs.job }}
          path: |
            ${{ steps.out.outputs.dir }}/youtube.txt
            ${{ steps.out.outputs.dir }}/cover_1.jpg
            ${{ steps.out.outputs.dir }}/cover_2.jpg
            ${{ steps.out.outputs.dir }}/thumbnail.jpg
            ${{ steps.out.outputs.dir }}/subs.srt
            ${{ steps.out.outputs.dir }}/shorts/shorts.json
          retention-days: 30

      - name: Диагностика при падении
        if: failure()
        run: |
          echo "=== папки ==="; find work -maxdepth 4 -type d 2>/dev/null || echo "нет"
          echo "=== файлы ==="; find work -maxdepth 4 -type f 2>/dev/null | head -40 || true
